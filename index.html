<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Family Portrait</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
<header><h1>Music Family Portrait</h1><p>좋아하는 음악 장르로 최대 7명의 가상 가족사진을 구성합니다.</p></header>
<section class="panel">
<h2>1 · 장르와 인원 선택</h2>
<button id="fillExample" type="button" class="subtle">장르 예시 불러오기</button>
<div id="genres" class="artist-grid"></div>
<button id="addGenre" type="button" class="subtle">장르 추가</button>
<p id="counts" role="status"></p>
</section>
<section class="panel">
<h2>2 · 가족사진</h2>
<p>실사풍 가족사진의 인원과 배치를 확인하는 모의 데모입니다.</p>
<p id="selection"></p>
<button id="generate" type="button" disabled>사진 1장 만들기</button>
<div id="result" class="card" hidden></div>
</section>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
